<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="beastx terminal: student dev from Kerala building apps, backends, minecraft tools and games">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .prompt { fill: #a78bfa; font-size: 17px; }
    .cmd { fill: #e4e4e7; font-size: 17px; }
    .out { fill: #a1a1aa; font-size: 17px; }
    .hi { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .dim { fill: #52525b; font-size: 13px; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.9s; }
    .l4 { animation-delay: 2.7s; }
    .l5 { animation-delay: 3.5s; }
    .l6 { animation-delay: 4.3s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 5s linear infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-40px); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(330px); opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="#050505" stroke="#27272a"/>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="url(#glow)"/>

  <rect x="0.5" y="0.5" width="899" height="40" rx="14" fill="#0a0a0c"/>
  <rect x="0.5" y="26" width="899" height="15" fill="#0a0a0c"/>
  <line x1="0" y1="40.5" x2="900" y2="40.5" stroke="#27272a"/>
  <circle cx="26" cy="21" r="6" fill="#3f3f46"/>
  <circle cx="48" cy="21" r="6" fill="#3f3f46"/>
  <circle cx="70" cy="21" r="6" fill="#a78bfa"/>
  <text x="450" y="26" text-anchor="middle" class="dim">beastx // portfolio</text>

  <rect class="scan" x="1" y="41" width="898" height="2" fill="url(#bar)"/>

  <g class="line l1">
    <text x="36" y="86" class="prompt">beastx@kerala</text>
    <text x="172" y="86" class="dim">:~$</text>
    <text x="210" y="86" class="cmd">whoami</text>
  </g>
  <g class="line l2">
    <text x="36" y="118" class="hi">BEASTX</text>
    <text x="118" y="118" class="out">student dev. apps, backends, minecraft tools, games.</text>
  </g>

  <g class="line l3">
    <text x="36" y="164" class="prompt">beastx@kerala</text>
    <text x="172" y="164" class="dim">:~$</text>
    <text x="210" y="164" class="cmd">stack --now</text>
  </g>
  <g class="line l4">
    <text x="36" y="196" class="out">flutter  /  dart  /  node.js  /  java  /  unity</text>
  </g>

  <g class="line l5">
    <text x="36" y="242" class="prompt">beastx@kerala</text>
    <text x="172" y="242" class="dim">:~$</text>
    <text x="210" y="242" class="cmd">status</text>
  </g>
  <g class="line l6">
    <text x="36" y="274" class="out">shipping:</text>
    <text x="128" y="274" class="hi">wavelet  /  my kochi  /  trackd in</text>
    <rect class="cursor" x="468" y="260" width="10" height="18" fill="#a78bfa"/>
  </g>
</svg>
